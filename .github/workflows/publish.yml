name: Publish image

# Build the Docker image and push it to GitHub Container Registry (GHCR).
# Auth uses the built-in GITHUB_TOKEN — no secrets to configure.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Assemble release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > notes.md
          [ -s notes.md ] && printf '\n---\n\n' >> notes.md
          cat >> notes.md <<'EOF'
          ## Install

          All you need is a running InvoiceNinja and Docker — no checkout, no build.

          **1. Create an API token in InvoiceNinja** — *Settings → Account Management → Integrations → API tokens*. This token is the only credential: invoiceninja-mcp stores no secret and forwards it as `X-API-TOKEN` to InvoiceNinja. Each client presents its own token per request.

          **2. Add invoiceninja-mcp to your InvoiceNinja's `docker-compose.yaml`** — one service, pulling the prebuilt image, so there's nothing to clone or build:

          ```yaml
          services:
            invoiceninja:
              # ... your existing InvoiceNinja service ...

            invoiceninja-mcp:
              image: ghcr.io/marceltov/invoiceninja-mcp:__VERSION__
              container_name: invoiceninja-mcp
              restart: unless-stopped
              environment:
                # Service name of your existing InvoiceNinja on the same compose network.
                INVOICENINJA_SERVER_URL: http://invoiceninja:80
              ports:
                - "8081:8081"
          ```

          Then start it:

          ```bash
          docker compose up -d invoiceninja-mcp
          ```

          **3. Connect your MCP client** with the token from step 1:

          ```bash
          claude mcp add invoiceninja --scope user --transport http \
            http://invoiceninja-mcp-hostname-or-ip:8081/mcp \
            --header "Authorization: YOUR_INVOICENINJA_API_TOKEN"
          ```

          Full guide: [README](https://github.com/Marceltov/invoiceninja-mcp/blob/__TAG__/README.md#quick-start)
          EOF
          sed -i "s|__VERSION__|${TAG#v}|g; s|__TAG__|$TAG|g" notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
